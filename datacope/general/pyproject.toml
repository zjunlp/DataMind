[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datacope"
version = "0.1.0"
description = "A generic version of the Datacope framework that automatically produces skills for data analysis tasks"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "DataCOPE Team"},
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "requests>=2.25.0",
    "tqdm>=4.60.0",
    "omegaconf>=2.1.0",
    "pydantic>=2.0",
    "openai>=1.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "pydantic>=1.8.0",
    "pyyaml>=5.4.0",
    "httpx>=0.24.0",
    "transformers>=4.51.0",
    "matplotlib>=3.10.7",
    "seaborn>=0.13.2",
    "requests",
    "httpx",
    "docker",
    "jupyter-client",
    "claude-agent-sdk==0.2.108",
    "openai-codex-sdk==0.1.11"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
